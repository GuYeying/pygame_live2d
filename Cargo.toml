[package]
name = "pygame_live2d"
version = "0.4.0"
edition = "2024"
description = "pygamest 生态 Live2D/Cubism 运行时适配层——mocari v0.4.0 vendored（MIT，Eatgrapes/Mocari 经 LunaMate 内嵌副本溯源）"
license = "MIT"
repository = "https://github.com/Eatgrapes/Mocari"
publish = false

[features]
default = []
wgpu = ["dep:wgpu"]
benchmark-support = []

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
wgpu = { version = "30.0.0", features = ["noop"], optional = true }
rapidhash = { version = "4.5.1", features = ["unsafe"] }

[[bench]]
name = "deformer_composition"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "deformer_composition_allocations"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "runtime_mesh_update"
harness = false
required-features = ["benchmark-support"]

[dev-dependencies]
allocation-counter = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
mimalloc = "0.1.52"
